<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload = () =>{
            document.querySelector("#btnGet").onclick = getFunc;
            document.querySelector("#btnPost").onclick = postFunc;
        }

        let xhr;

        function getFunc(){
            let frm = document.forms["frm"];
            let irum = frm.name.value;
            let nai = frm.age.value;
            // alert(irum + " " + nai)

            xhr = new XMLHttpRequest();   //서버와 Ajax 통신용 클래스 객체 생성
            let fname = "js16.py?irum=" + irum + "&nai=" + nai;  // "파일명?변수=값&변수=값"
            // 임시 방편용 js16.py 작성 (얘는 처리 후 json을 반환하다고 가정)

            xhr.open("GET",fname, true);  //  true: 비동기 방식, false: 동기 방식 
            xhr.onreadystatechange = function(){
                if(xhr.readyState === 4 && xhr.status === 200){ // status : 3자릿수의 숫자로 HTTP 상태 코드를 나타내는 프로퍼티 
                    process1();
                }
            }
            xhr.send();  // send() : 요청을 송신하는 메소드
        }

        function process1(){
            alert(xhr.responseText);  // responseText : 요청에 대한 응답을 Text형태로 반환한 프로퍼티

        }

        function postFunc(){
            let frm = document.forms["frm"];
            let irum = frm.name.value;
            let nai = frm.age.value;
            // alert(irum + " " + nai)
            // Post 방식 연결 흐름
            xhr = new XMLHttpRequest();   //서버와 Ajax 통신용 클래스 객체 생성
            let fname = "js16.py";  
    
            xhr.open("GET",fname, true);  //  true: 비동기 방식, false: 동기 방식 
            xhr.onreadystatechange = function(){
                if(xhr.readyState === 4 && xhr.status === 200){ // status : 3자릿수의 숫자로 HTTP 상태 코드를 나타내는 프로퍼티 
                    process1();
                }
            }
            xhr.setRequestHeader("Content-Type","application/x-www-form-urlencoded")
            xhr.send("irum=" + irum + "&nai=" + nai);  // body 영역에 포함되어 전송(대용량)
    }

    </script>
</head>
<body>
    <h2>Ajax 이해 : get, post</h2>
    <form name="frm">
        이름 : <input type="text" name="name" value="tom"><br>
        나이 : <input type="text" name="age" value="33"><br>
        <input type="button" value="get 방식" id="btnGet">
        <input type="button" value="post 방식"id="btnPost">
    </form>
</body>
</html>
